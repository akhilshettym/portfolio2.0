name: production

on:
  pull_request:
    branches: ["main"]

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  core-checks:
    name: Core (Admin UI) Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./core/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit
        # run: npm audit --omit=dev

      - name: Check Formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Run Jest Tests
        run: npm run jest

  gateway-checks:
    name: Gateway (Backend) Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./gateway/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit
        # run: npm audit --omit=dev

      - name: Check Formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Run Jest Tests
        run: npm run jest

  studio-checks:
    name: Studio (Main UI) Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./studio
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./studio/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Security Audit
        run: npm audit
        # run: npm audit --omit=dev

      - name: Check Formatting
        run: npm run format:check

      - name: Run Linter
        run: npm run lint

      - name: Run Jest Tests
        run: npm run jest